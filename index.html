
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bias Playground — Your Brain Is Lying To You</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b0b;
  --surface: #131313;
  --surface2: #1a1a1a;
  --border: #252525;
  --border2: #333;
  --accent: #00cfff;
  --accent-dim: #007a99;
  --accent2: #ff3c3c;
  --accent3: #c8ff00;
  --text: #e2e2e2;
  --muted: #555;
  --muted2: #777;
  --reveal-bg: #001a22;
  --reveal-border: #004455;
  --reveal-text: #7ee8ff;
  --sev1: #00cfff;
  --sev2: #c8ff00;
  --sev3: #ffd500;
  --sev4: #ff7a00;
  --sev5: #ff3c3c;
}
 
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.7;
  min-height:100vh;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
}
 
.container{max-width:780px;margin:0 auto;padding:36px 20px 100px;}
 
/* HEADER */
.site-header{
  border-bottom:1px solid var(--border);padding-bottom:22px;margin-bottom:32px;
  display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;
}
.logo{font-family:'Source Serif 4',Georgia,serif;font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1;}
.logo .accent{color:var(--accent);}
.logo .accent2{color:var(--accent2);}
.tagline{color:var(--muted);font-size:13px;letter-spacing:0.1em;text-transform:uppercase;margin-top:5px;}
.header-right{text-align:right;font-size:13px;color:var(--muted);line-height:2;}
.header-right a{color:var(--accent3);text-decoration:none;border-bottom:1px solid transparent;transition:border-color 0.2s;}
.header-right a:hover{border-bottom-color:var(--accent3);}
.progress-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;}
.progress-bar-wrap{height:3px;background:var(--border);margin-top:4px;width:160px;}
.progress-bar-fill{height:100%;background:var(--accent);transition:width 0.4s ease;width:0;}
.progress-count{color:var(--accent);font-weight:500;}
 
/* INTRO */
.intro{
  font-size:15px;color:var(--muted2);line-height:1.85;margin-bottom:32px;
  padding:14px 16px;border-left:3px solid var(--accent-dim);
}
.intro strong{color:var(--text);}
 
/* CATEGORY */
.category{margin-bottom:4px;}
.category-header{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  cursor:pointer;user-select:none;border-bottom:1px solid var(--border);margin-bottom:4px;
}
.category-header:hover .category-title{color:var(--accent);}
.category-icon{font-size:18px;width:24px;text-align:center;}
.category-title{
  font-family:'Source Serif 4',Georgia,serif;font-weight:800;font-size:16px;
  text-transform:uppercase;letter-spacing:0.1em;color:var(--text);transition:color 0.2s;
}
.category-count{font-size:13px;color:var(--muted);margin-left:auto;}
.category-chevron{color:var(--muted);font-size:13px;transition:transform 0.2s;}
.category.collapsed .category-chevron{transform:rotate(-90deg);}
.category.collapsed .category-body{display:none;}
 
/* EXPERIMENT CARD */
.exp-card{
  border:1px solid var(--border);margin-bottom:2px;overflow:hidden;
}
.exp-header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;background:var(--surface);cursor:pointer;user-select:none;
  transition:background 0.15s;
}
.exp-header:hover{background:var(--surface2);}
.exp-header-left{display:flex;align-items:center;gap:10px;}
.exp-number{font-size:12px;color:var(--muted);width:20px;flex-shrink:0;}
.exp-title{font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent);}
